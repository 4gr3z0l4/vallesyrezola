[build]
  publish = "dist"
  command = "npm run build"

[build.processing.html]
  pretty_urls = false

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "https://vallesyrezola.netlify.app/*"
  to = "https://vallesyrezola.es/:splat"
  status = 301
  force = true
