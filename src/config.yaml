site:
  name: Valles y Rezola
  description: Estructuras de hormigón para obra civil y edificación en Madrid.
  site: 'http://www.vallesyrezola.es'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: -zBe5ujFoKs_OJelL9O82jN6500LSpZCkrtHtKW6OMo

# Default SEO metadata
metadata:
  title:
    default: Valles y Rezola
    template: '%s — Valles y Rezola'
  description: "\U0001F680 Estructuras de hormigón para obra civil y edificación en Madrid."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Valles y Rezola
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: '@4gr3z0l4'
    site: '@4gr3z0l4'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
